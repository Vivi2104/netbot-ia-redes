<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetBot - Asistente de Redes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>🌐 NetBot</h2>
            <p>Asistente de Redes y Telecomunicaciones</p>
        </div>
        
        <div class="network-modes">
            <button class="mode-btn active" data-mode="profesor">👨‍🏫 Profesor del Tec</button>
            <button class="mode-btn" data-mode="cisco">💻 Modo CCNA / Cisco</button>
            <button class="mode-btn" data-mode="admin">🛠️ Administrador Rudo</button>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message message-content">
                ¡Hola! Soy NetBot. Puedo ayudarte con temas de modelo OSI, subneteo, protocolos (TCP/IP), enrutamiento y más. ¿Cuál es tu duda hoy?
            </div>
        </div>

        <div class="suggestions-container">
            <button class="suggest-btn">¿Cómo calcular la máscara de una /26?</button>
            <button class="suggest-btn">Diferencia entre TCP y UDP.</button>
            <button class="suggest-btn">Comandos para configurar OSPF básico.</button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Pregúntame sobre subredes, Cisco, capas OSI..." autocomplete="off">
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
